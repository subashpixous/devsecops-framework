# Universal Production DevSecOps Security Validation Framework
# Reusable security pipeline -- the ONLY public entrypoint of this framework.
#
# Callers stay thin:
#
#   jobs:
#     security:
#       uses: <owner>/devsecops-framework/.github/workflows/security-pipeline.yml@<sha>
#       secrets:
#         SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
#         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
#
# This workflow NEVER builds, deploys, or modifies the calling project. It reads
# the repository, reads the analysis server, optionally probes an explicitly
# supplied deployed URL, and writes reports to an artifact.
#
# Scanner availability is never fatal: a tool that fails to install makes its
# category NOT_VERIFIED. It can never make it PASS.

name: Security Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      project_name:
        description: "Override the detected project name."
        type: string
        default: ""
      environment:
        description: "Environment label (production, qa, ...). Left NOT_ESTABLISHED if empty."
        type: string
        default: ""
      deployment_target:
        description: "Deployment target. Left NOT_ESTABLISHED if empty."
        type: string
        default: ""
      deployed_url:
        description: "Live URL for post-deployment testing. Runtime stages are SKIPPED without it."
        type: string
        default: ""
      stages:
        description: "Comma-separated stages: PRE_BUILD,POST_BUILD,AGGREGATION,POST_DEPLOY,CLOUD. Default: all."
        type: string
        default: ""
      images:
        description: "Comma-separated container image refs for image/SBOM/signature scanning."
        type: string
        default: ""
      bundle_dirs:
        description: "Comma-separated built frontend directories. Auto-detected when empty."
        type: string
        default: ""
      openapi_files:
        description: "Comma-separated OpenAPI spec paths. Auto-detected when empty."
        type: string
        default: ""
      cloud:
        description: "Cloud provider for posture scanning (aws|azure|gcp). Auto-detected when empty."
        type: string
        default: ""
      aws_region:
        type: string
        default: ""
      zap_mode:
        description: "baseline (passive, safe) or full (ACTIVE scan - only where authorised)."
        type: string
        default: "baseline"
      baseline_path:
        description: "Path in the calling repo to a previous normalized-findings.json for lifecycle diffing."
        type: string
        default: ""
      exceptions_path:
        description: "Path in the calling repo to the exceptions / accepted-risk file."
        type: string
        default: ""
      sonar_project_key:
        type: string
        default: ""
      policy_path:
        description: "Path in the calling repo to a policy override file."
        type: string
        default: ""
      build_status:
        description: "Build result reported by the caller (pass/fail). Never inferred."
        type: string
        default: ""
      deployment_status:
        description: "Deployment result reported by the caller. Never inferred."
        type: string
        default: ""
      active_phase:
        description: >-
          Roadmap phase to execute. Categories above this phase report
          NOT_IMPLEMENTED and their collectors do not run, so this must never sit
          below the phase declared in framework/policy/default-policy.yml.
          Asserted by tests/test_release_consistency.py.
        type: number
        default: 7
      install_tools:
        description: "Install the external scanners. Disable to use a pre-baked runner image."
        type: boolean
        default: true
      upload_sarif:
        description: >-
          Upload findings to GitHub code scanning so they appear inline on the pull
          request and in the Security tab. Requires the caller to grant
          `security-events: write`. Disable for a repository where code scanning is
          unavailable; the SARIF file is written to the artifact either way.
        type: boolean
        default: true
      fail_on_security:
        description: "Fail the job when SECURITY is not PASS. Default false: observe, do not block."
        type: boolean
        default: false
      framework_repository:
        type: string
        default: "subashpixous/devsecops-framework"
      framework_ref:
        type: string
        default: "main"
      artifact_name:
        type: string
        default: "security-results"
      artifact_retention_days:
        type: number
        default: 30
      python_version:
        type: string
        default: "3.11"
      runs_on:
        type: string
        default: "ubuntu-latest"
    secrets:
      SONAR_TOKEN:
        description: "Existing SonarQube token. Used read-only; never rotated or logged."
        required: false
      SONAR_HOST_URL:
        description: "Existing SonarQube host URL."
        required: false
      FORTYTWO_CRUNCH_TOKEN:
        description: "42Crunch API token. Without it, API spec security reports NOT_VERIFIED."
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      COSIGN_PUBLIC_KEY:
        description: "Public key for signature verification. Verification only; never signs."
        required: false
    outputs:
      security_status:
        description: "PASS | FAILED | NOT_VERIFIED"
        value: ${{ jobs.security.outputs.security_status }}
      runtime_security_status:
        value: ${{ jobs.security.outputs.runtime_security_status }}
      build_status:
        value: ${{ jobs.security.outputs.build_status }}
      deployment_status:
        value: ${{ jobs.security.outputs.deployment_status }}
      open_findings:
        value: ${{ jobs.security.outputs.open_findings }}
      new_findings:
        value: ${{ jobs.security.outputs.new_findings }}
      fixed_findings:
        value: ${{ jobs.security.outputs.fixed_findings }}
      coverage_complete:
        description: "false whenever any applicable category was not tested."
        value: ${{ jobs.security.outputs.coverage_complete }}

permissions:
  contents: read

jobs:
  security:
    name: Security validation
    runs-on: ${{ inputs.runs_on }}
    # Least privilege. `security-events: write` is the one write scope, and it
    # exists solely so findings reach the pull request instead of an artifact
    # nobody downloads. A caller that does not grant it sets upload_sarif: false
    # and the upload step is skipped rather than failing the run.
    permissions:
      contents: read
      security-events: write
    outputs:
      security_status: ${{ steps.run.outputs.security_status }}
      runtime_security_status: ${{ steps.run.outputs.runtime_security_status }}
      build_status: ${{ steps.run.outputs.build_status }}
      deployment_status: ${{ steps.run.outputs.deployment_status }}
      open_findings: ${{ steps.run.outputs.open_findings }}
      new_findings: ${{ steps.run.outputs.new_findings }}
      fixed_findings: ${{ steps.run.outputs.fixed_findings }}
      coverage_complete: ${{ steps.run.outputs.coverage_complete }}

    steps:
      # Third-party actions are pinned to immutable full commit SHAs. A tag can be
      # silently repointed at different code; a SHA cannot. The trailing comment
      # records which release each SHA corresponds to.
      - name: Checkout project under analysis
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: project
          fetch-depth: 0          # full history: gitleaks scans past commits
          persist-credentials: false

      - name: Checkout security framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ inputs.framework_repository }}
          # job_workflow_sha pins the framework to exactly the commit that defines
          # this reusable workflow, so code and workflow can never drift apart.
          ref: ${{ github.job_workflow_sha || inputs.framework_ref }}
          path: framework
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install framework dependencies
        working-directory: framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Framework self-test
        working-directory: framework
        run: |
          echo "Verifying framework invariants before trusting any verdict it produces."
          python -m unittest discover -s tests -p "test_*.py"

      # Every install is best-effort. A tool that fails to install makes its
      # category NOT_VERIFIED, which the status engine already handles.
      - name: Install security scanners
        if: inputs.install_tools
        continue-on-error: true
        env:
          TRIVY_VERSION: "0.74.0"
          GITLEAKS_VERSION: "8.23.1"
          NUCLEI_VERSION: "3.3.7"
          COSIGN_VERSION: "2.4.1"
        run: |
          set -uo pipefail
          install_log=/tmp/tool-install.log
          : > "$install_log"

          try() {
            echo "--- installing $1 ---" | tee -a "$install_log"
            shift
            if "$@" >>"$install_log" 2>&1; then
              echo "    OK"
            else
              echo "    FAILED (category will report NOT_VERIFIED)"
            fi
          }

          # Verify a download against the checksums file published with the same
          # release, then record the digest we actually got.
          #
          # WHAT THIS PROTECTS AGAINST: a truncated, corrupted, or tampered-in-
          # transit download -- the realistic failure modes for a CI runner
          # pulling a binary over the public internet. A partial download that
          # still exits 0 would otherwise install a broken scanner, and a broken
          # scanner is the exact condition this framework exists to notice.
          #
          # WHAT IT DOES NOT PROTECT AGAINST: a compromised upstream release.
          # The checksums come from the same origin as the artefact, so an
          # attacker who can replace one can replace the other. Defending
          # against that needs digests pinned in this file and reviewed on every
          # bump; it is a deliberate future step, not something this check
          # silently claims to do.
          verify_sha256() {
            local file="$1" expected="$2" name="$3"
            local actual
            actual="$(sha256sum "$file" | awk '{print $1}')"
            echo "    $name sha256=$actual" >>"$install_log"
            if [ -z "$expected" ]; then
              echo "    WARNING: no published checksum found for $name; digest recorded only" \
                | tee -a "$install_log"
              return 0
            fi
            if [ "$actual" != "$expected" ]; then
              echo "    CHECKSUM MISMATCH for $name (expected $expected, got $actual)" \
                | tee -a "$install_log"
              return 1
            fi
            echo "    checksum verified for $name" >>"$install_log"
          }

          try semgrep python -m pip install --quiet semgrep
          try checkov python -m pip install --quiet checkov

          # Look up one artefact's digest in a release checksums file.
          published_sha() {
            local url="$1" artefact="$2"
            curl -sSfL "$url" 2>/dev/null | grep -F " $artefact" | head -1 | awk '{print $1}' || true
          }

          try gitleaks bash -c '
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            artefact="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -sSfL -o /tmp/gitleaks.tar.gz "${base}/${artefact}" &&
            verify_sha256 /tmp/gitleaks.tar.gz "$(published_sha "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" "$artefact")" gitleaks &&
            tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks'

          try trivy bash -c '
            base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
            artefact="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            curl -sSfL -o /tmp/trivy.tar.gz "${base}/${artefact}" &&
            verify_sha256 /tmp/trivy.tar.gz "$(published_sha "${base}/trivy_${TRIVY_VERSION}_checksums.txt" "$artefact")" trivy &&
            tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy'

          try nuclei bash -c '
            base="https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}"
            artefact="nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
            curl -sSfL -o /tmp/nuclei.zip "${base}/${artefact}" &&
            verify_sha256 /tmp/nuclei.zip "$(published_sha "${base}/nuclei_${NUCLEI_VERSION}_checksums.txt" "$artefact")" nuclei &&
            unzip -oq /tmp/nuclei.zip -d /usr/local/bin nuclei'

          # cosign is pinned to a version rather than "latest": a floating
          # download makes the evidence manifest record a version nobody chose,
          # and cosign is the tool that verifies everyone else's signatures.
          try cosign bash -c '
            base="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
            curl -sSfL -o /tmp/cosign "${base}/cosign-linux-amd64" &&
            verify_sha256 /tmp/cosign "$(published_sha "${base}/cosign_checksums.txt" "cosign-linux-amd64")" cosign &&
            install -m 0755 /tmp/cosign /usr/local/bin/cosign'

          echo "=== scanner availability ==="
          for t in semgrep gitleaks trivy checkov nuclei cosign docker; do
            printf '  %-10s %s\n' "$t" "$(command -v "$t" >/dev/null && echo AVAILABLE || echo MISSING)"
          done

      - name: Report scanner availability
        working-directory: framework
        run: python -m framework.cli tools

      - name: Run security validation
        id: run
        working-directory: framework
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          FORTYTWO_CRUNCH_TOKEN: ${{ secrets.FORTYTWO_CRUNCH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          AWS_REGION: ${{ inputs.aws_region }}
          # Inputs are passed through the environment rather than interpolated
          # into the shell, so a hostile input value cannot become a command.
          IN_PROJECT_NAME: ${{ inputs.project_name }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          IN_DEPLOYED_URL: ${{ inputs.deployed_url }}
          IN_STAGES: ${{ inputs.stages }}
          IN_IMAGES: ${{ inputs.images }}
          IN_BUNDLE_DIRS: ${{ inputs.bundle_dirs }}
          IN_OPENAPI_FILES: ${{ inputs.openapi_files }}
          IN_CLOUD: ${{ inputs.cloud }}
          IN_AWS_REGION: ${{ inputs.aws_region }}
          IN_ZAP_MODE: ${{ inputs.zap_mode }}
          IN_BASELINE_PATH: ${{ inputs.baseline_path }}
          IN_EXCEPTIONS_PATH: ${{ inputs.exceptions_path }}
          IN_SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          IN_POLICY_PATH: ${{ inputs.policy_path }}
          IN_BUILD_STATUS: ${{ inputs.build_status }}
          IN_DEPLOYMENT_STATUS: ${{ inputs.deployment_status }}
          IN_ACTIVE_PHASE: ${{ inputs.active_phase }}
          IN_FAIL_ON_SECURITY: ${{ inputs.fail_on_security }}
        run: |
          set -euo pipefail

          args=(
            --workspace "${GITHUB_WORKSPACE}/project"
            --output "${GITHUB_WORKSPACE}/security-results"
            --project-name "${IN_PROJECT_NAME}"
            --environment "${IN_ENVIRONMENT}"
            --deployment-target "${IN_DEPLOYMENT_TARGET}"
            --deployed-url "${IN_DEPLOYED_URL}"
            --images "${IN_IMAGES}"
            --bundle-dirs "${IN_BUNDLE_DIRS}"
            --openapi-files "${IN_OPENAPI_FILES}"
            --cloud "${IN_CLOUD}"
            --aws-region "${IN_AWS_REGION}"
            --zap-mode "${IN_ZAP_MODE}"
            --sonar-project-key "${IN_SONAR_PROJECT_KEY}"
            --build-status "${IN_BUILD_STATUS}"
            --deployment-status "${IN_DEPLOYMENT_STATUS}"
            --active-phase "${IN_ACTIVE_PHASE}"
          )
          [ -n "${IN_STAGES}" ]          && args+=( --stage "${IN_STAGES}" )
          [ -n "${IN_POLICY_PATH}" ]     && args+=( --policy "${GITHUB_WORKSPACE}/project/${IN_POLICY_PATH}" )
          [ -n "${IN_BASELINE_PATH}" ]   && args+=( --baseline "${GITHUB_WORKSPACE}/project/${IN_BASELINE_PATH}" )
          [ -n "${IN_EXCEPTIONS_PATH}" ] && args+=( --exceptions "${GITHUB_WORKSPACE}/project/${IN_EXCEPTIONS_PATH}" )
          [ "${IN_FAIL_ON_SECURITY}" = "true" ] && args+=( --fail-on-security )

          python -m framework.cli run "${args[@]}"

      - name: Collect tool install log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/security-results"
          [ -f /tmp/tool-install.log ] && \
            cp /tmp/tool-install.log "${GITHUB_WORKSPACE}/security-results/tool-install.log" || true

      - name: Upload findings to GitHub code scanning
        # A finding in a downloadable artifact is a finding nobody reads. This is
        # what puts each one on its line in the pull request.
        #
        # always(): a run that ended in FAILED is exactly the run whose findings
        # the developer needs to see.
        #
        # continue-on-error: code scanning is unavailable on some plans and on
        # forked-PR events. That is a delivery problem, not a security result, and
        # it must never convert into one.
        if: always() && inputs.upload_sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d  # v3.30.0
        with:
          sarif_file: security-results/security.sarif
          category: devsecops-framework

      - name: Upload security results
        # always(): a failed or blocked run is exactly when the evidence matters most.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: security-results/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn
