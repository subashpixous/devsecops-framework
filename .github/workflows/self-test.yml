# The framework's own CI.
#
# A security framework that is not itself tested cannot be trusted to report on
# anything else. The invariant suite in tests/ must pass before any tag is cut:
# it is what guarantees a scanner failure can never become SECURITY = PASS.

name: Framework self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Invariants (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run invariant tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify every collector is read-only where it must be
        run: |
          set -euo pipefail
          echo "Asserting no mutating HTTP verb exists in the read-only collectors."
          if grep -rnE 'method="(POST|PUT|PATCH|DELETE)"' \
               framework/collectors/sonarqube.py \
               framework/collectors/runtime_probes.py \
               framework/collectors/iam_access_analyzer.py; then
            echo "::error::A mutating HTTP method was found in a read-only collector."
            exit 1
          fi
          echo "OK: read-only collectors issue GET only."

      - name: Verify no hard-coded project identifiers
        run: |
          set -euo pipefail
          echo "Asserting the framework contains no project-specific logic."
          if grep -rniE 'dashboard-v2v|oneportal|tncwwb|pixous|subashawsdevops' framework/ ; then
            echo "::error::A project-specific identifier leaked into the framework."
            exit 1
          fi
          echo "OK: framework is project-agnostic."

      - name: Verify secret-bearing scanner output is stripped
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from framework.collectors.gitleaks import strip_secret_material
          raw = [{"RuleID": "k", "File": "f", "Secret": "REALSECRET", "Match": "x REALSECRET"}]
          cleaned = strip_secret_material(raw)
          blob = repr(cleaned)
          assert "REALSECRET" not in blob, "gitleaks secret survived stripping"
          assert "Secret" not in cleaned[0] and "Match" not in cleaned[0]
          print("OK: gitleaks secret material is stripped at collection.")
          PY

      - name: Verify every registered scanner resolves a collector and an adapter
        run: |
          set -euo pipefail
          python - <<'PY'
          from framework.core.registry import (
              CATEGORY_BY_KEY, import_failures, load_builtin_scanners, registered_scanners,
          )
          load_builtin_scanners()
          failures = import_failures()
          assert not failures, "collector modules failed to import: %s" % failures
          scanners = registered_scanners()
          assert scanners, "no scanners registered"
          for reg in scanners:
              assert reg.category_key in CATEGORY_BY_KEY, reg.tool
              adapter = reg.adapter_factory()
              assert hasattr(adapter, "normalize"), reg.tool
          print("OK: %d scanners registered, all resolvable." % len(scanners))
          PY

      - name: Verify fingerprints do not collide across independent findings
        run: |
          set -euo pipefail
          python - <<'PY'
          from framework.core.schema import Finding

          def f(**kw):
              base = dict(tool="t", rule="r", file="f.json", category="secret",
                          description="d", severity="HIGH", native_id="", line=0, component="")
              base.update(kw)
              return Finding(**base)

          # Same rule, same file, different positions -> must be distinct findings.
          lines = [f(line=n) for n in (10, 40, 116, 118)]
          assert len({x.fingerprint for x in lines}) == 4, "line collision"

          # One CVE affecting two packages: same file, same line, same native id.
          pkgs = [f(native_id="CVE-1", component="a@1"), f(native_id="CVE-1", component="b@2")]
          assert len({x.fingerprint for x in pkgs}) == 2, "component collision"

          # Uniqueness must not cost idempotence.
          assert f(line=5, native_id="n", component="c").fingerprint ==                  f(line=5, native_id="n", component="c").fingerprint, "not stable"
          print("OK: independent findings receive independent fingerprints.")
          PY

      - name: Verify every category is covered or explicitly framework-internal
        run: |
          set -euo pipefail
          python - <<'PY'
          from framework.core.categories import CATEGORY_REGISTRY
          from framework.core.registry import load_builtin_scanners, registered_scanners
          from framework.core.status_engine import FRAMEWORK_INTERNAL_CATEGORIES
          load_builtin_scanners()
          covered = {r.category_key for r in registered_scanners()} | FRAMEWORK_INTERNAL_CATEGORIES
          missing = [c.key for c in CATEGORY_REGISTRY if c.key not in covered]
          assert not missing, "categories with no scanner and not framework-internal: %s" % missing
          print("OK: all %d categories are covered." % len(CATEGORY_REGISTRY))
          PY

      - name: Project-adaptive detection across stacks
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, tempfile
          from framework.detect.detector import detect

          def build(root, files):
              for path, content in files.items():
                  full = os.path.join(root, path)
                  os.makedirs(os.path.dirname(full), exist_ok=True)
                  open(full, "w", encoding="utf-8").write(content)

          cases = {
              "react":    ({"package.json": '{"dependencies":{"react":"18"}}'},            {"frontend": True}),
              "dotnet":   ({"Api.csproj": '<Project Sdk="Microsoft.NET.Sdk.Web"></Project>'}, {"backend": True}),
              "flutter":  ({"pubspec.yaml": "name: a\ndependencies:\n  flutter:\n", "web/index.html": "<html>"}, {"frontend": True}),
              "php":      ({"composer.json": '{"require":{"laravel/framework":"^10"}}'},   {"backend": True}),
              "terraform":({"main.tf": 'resource "aws_s3_bucket" "b" {}'},                  {"iac": True}),
              "k8s":      ({"d.yaml": "apiVersion: apps/v1\nkind: Deployment\n"},           {"kubernetes": True}),
              "docker":   ({"Dockerfile": "FROM alpine\n"},                                 {"docker": True}),
              "openapi":  ({"openapi.json": '{"openapi":"3.0.0","paths":{}}'},              {"openapi": True}),
          }
          for name, (files, expected) in cases.items():
              with tempfile.TemporaryDirectory() as root:
                  build(root, files)
                  caps = detect(root)
                  for key, want in expected.items():
                      assert caps[key] == want, "%s: expected %s=%s got %s" % (name, key, want, caps[key])
                  # Nothing may be invented.
                  assert caps["deployed_url"] == ""
                  assert caps["authenticated_testing_available"] is False
              print("  %-10s -> %s" % (name, expected))
          print("OK: detection is project-adaptive and invents nothing.")
          PY

      - name: Smoke test the full pipeline with no scanners installed
        run: |
          set -euo pipefail
          # With no external tools present, every external category must be
          # unverified and the verdict must NOT be PASS.
          # --no-enrichment keeps this test hermetic: a CI job must not fail
          # because a third-party API was slow, and enrichment availability is
          # covered by its own unit tests.
          python -m framework.cli run \
            --workspace . \
            --output /tmp/security-results \
            --environment ci \
            --no-enrichment
          test -f /tmp/security-results/final-report.json
          test -f /tmp/security-results/report.md
          test -f /tmp/security-results/security-report.pdf
          test -f /tmp/security-results/findings.csv
          test -f /tmp/security-results/security.sarif
          test -f /tmp/security-results/evidence-manifest.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/security-results/final-report.json"))
          status = report["status"]["security"]
          assert status != "PASS", "no scanners installed but SECURITY reported PASS"
          assert report["status"]["coverage_complete"] is False
          print("OK: all five formats produced; SECURITY=%s (correctly not PASS)." % status)
          PY

      - name: Verify the run proves what it checked
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          report = json.load(open("/tmp/security-results/final-report.json"))
          manifest = json.load(open("/tmp/security-results/evidence-manifest.json"))

          # 1. Every scanner must appear in the census with a reason, so none can
          #    vanish silently.
          coverage = report["file_coverage"]
          assert coverage.get("per_scanner"), "the census reports no per-scanner coverage"
          for row in coverage["per_scanner"]:
              assert row["status"], "scanner %s has no coverage status" % row["tool"]
              assert row["statement"], "scanner %s has no plain-language statement" % row["tool"]
              # A scanner with no declared file reach must not report a fabricated
              # denominator.
              if not row["file_level"]:
                  assert row["not_analysed"] == 0, (
                      "%s declared no file reach but claims %d files missed"
                      % (row["tool"], row["not_analysed"])
                  )

          # 2. Enrichment must never silently look like "nothing is exploited".
          enrichment = report["enrichment"]
          assert enrichment["epss_status"].startswith("EPSS_")
          assert enrichment["kev_status"].startswith("KEV_")
          assert enrichment.get("statement")

          # 3. The evidence manifest must be reproducible and self-limiting.
          assert manifest["available"], manifest.get("reason")
          assert manifest["artefacts"], "no artefact digests recorded"
          assert "NOT signatures" in manifest["integrity_note"], (
              "the manifest must not imply its digests establish authenticity"
          )
          assert manifest["execution"]["scanners_registered"] > 0

          print("OK: %d scanners accounted for, %d artefacts hashed, enrichment state %s/%s."
                % (len(coverage["per_scanner"]), len(manifest["artefacts"]),
                   enrichment["epss_status"], enrichment["kev_status"]))
          PY

      - name: Verify a stale SonarQube analysis can never reach PASS
        run: |
          set -euo pipefail
          python - <<'PY'
          from framework.collectors.sonarqube import (
              SONARQUBE_RESULT_STALE, SONARQUBE_SCAN_COMPLETED, evaluate_freshness,
          )
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          commit = "a" * 40

          fresh, basis, _ = evaluate_freshness(now, commit, commit, now=now)
          assert fresh and basis == "revision", "a matching revision must be fresh"

          stale, basis, _ = evaluate_freshness(now, "b" * 40, commit, now=now)
          assert not stale, "a mismatched revision must be stale however recent"

          old, _, _ = evaluate_freshness(now - timedelta(days=400), "", "", now=now)
          assert not old, "an aged-out analysis must be stale"

          print("OK: stale SonarQube results cannot be presented as current.")
          PY
